name: Build OpenBook Audio
on:
  push:
    branches: ['testing/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/buffered-narrator.test.js
      - run: node --check src/main.js
      - run: node --check vite.config.js
      - run: npm run build
