 u().lastAttack={id,kind,mode,ds,natural,bonus,total,target:known?target:null,hit,crit,damaged:false};
 const desc=`d20 ${ds.join(' / ')} ${signed(bonus)} · ${mode==='normal'?'normal':mode==='adv'?'advantage':'disadvantage'}${hit===null?'':hit?' · HIT':' · MISS'}`;
 addResult('attack',`${x.name} ${cleave?'Cleave ':''}attack`,total,desc,hit===false?'miss':hit===true?'hit':'');commit();
}
function rollDamage(){const a=u().lastAttack;if(!a){note('Roll an attack first');return}if(a.hit===false){note('The recorded attack missed; roll again or adjust target AC');return}const x=W[a.id];const crit=!!a.crit;const times=crit?2:1;const base=rolls(times,wDie(a.id)).map(x=>a.id==='unarmed'&&x===1?die(wDie(a.id)):x);const flat=damageMod(a.id,a.kind==='cleave',a.kind==='offhand'||a.kind==='nick')+n(p().weaponBonuses[a.id]?.dmg);const rage=b().raging&&atkAbility(a.id)==='str'?2:0;let total=sum(base)+flat+rage;let sections=[`${times}d${wDie(a.id)} [${base.join(', ')}]`,`${signed(flat)} ability/weapon`,...(rage?[`+${rage} Rage`]:[])];
 if(a.id==='frost'){const cold=rolls(times,6);total+=sum(cold);sections.push(`+${sum(cold)} cold [${cold.join(', ')}]`)}
 if(b().raging&&!b().divineUsed){const fury=rolls(times,6);const extra=sum(fury)+Math.floor(n(p().level,5)/2);total+=extra;b().divineUsed=true;sections.push(`+${extra} Divine Fury [${fury.join(', ')}]+${Math.floor(n(p().level,5)/2)}`)}
 a.damaged=true;addResult('damage',`${x.name} ${crit?'critical ':''}damage`,total,sections.join(' · '),'hit');commit();
}
function rollInitiative(){const d=die(20);const total=d+ability('dex');addResult('initiative','Initiative',total,`d20 ${d} ${signed(ability('dex'))}`);commit()}
function rollSave(id){const adv=(id==='dex'&&!b().conditions.includes('Incapacitated'))||(id==='str'&&b().raging);const ds=rolls(adv?2:1,20),d=adv?Math.max(...ds):ds[0];const bonus=ability(id)+(id==='str'||id==='con'?prof():0);addResult('save',id.toUpperCase()+' save',d+bonus,`d20 ${ds.join(' / ')} ${signed(bonus)}${adv?' · advantage':''}`);commit()}
function skillStat(name,base){return b().raging&&u().primalKnowledge&&['Acrobatics','Intimidation','Perception','Stealth','Survival'].includes(name)?'str':base}
function rollSkill(name){const item=skillList.find(x=>x[0]===name);if(!item)return;const stat=skillStat(item[0],item[1]);const bonus=ability(stat)+(item[2]?prof():0);const adv=stat==='str'&&(b().raging||b().largeActive);const ds=rolls(adv?2:1,20),d=adv?Math.max(...ds):ds[0];addResult('skill',name+' check',d+bonus,`d20 ${ds.join(' / ')} ${signed(bonus)} · ${stat.toUpperCase()}${adv?' · advantage':''}`);commit()}
function rollCustom(sides){const d=die(sides);addResult('dice',`d${sides}`,d,`Rolled ${d} on 1d${sides}`);commit()}
function rollDeath(type){if(b().hp>0){note('Death saves apply at 0 HP');return}b()[type]=clamp(b()[type]+1,0,3);log('Death save',`${b().deathSuccess} successes, ${b().deathFail} failures`);commit()}
function toggleRage(){if(b().raging){b().raging=false;log('Rage','Ended');commit();return}if(b().rages<=0)return note('No Rages remaining');if(b().bonus)return note('Bonus action already used');b().rages--;b().bonus=true;b().raging=true;log('Rage','Activated · resist B/P/S, +2 STR damage');commit()}
function toggleLarge(){if(b().largeActive){b().largeActive=false;log('Large Form','Ended');commit();return}if(b().largeUsed)return note('Large Form already used today');if(b().bonus)return note('Bonus action already used');b().largeUsed=true;b().largeActive=true;b().bonus=true;log('Large Form','Activated · size Large, Speed +10 ft.');commit()}
function toggleReckless(){if(!b().reckless&&b().attacks>0)return note('Choose Reckless before the first attack roll of your turn');b().reckless=!b().reckless;log('Reckless Attack',b().reckless?'On · STR attacks gain advantage; enemies attack you with advantage':'Off');commit()}
function newTurn(){b().round++;b().action=false;b().bonus=false;b().reaction=false;b().attacks=0;b().reckless=false;b().divineUsed=false;b().cleaveUsed=false;b().lightAttacked=false;b().nickUsed=false;u().lastAttack=null;log('New turn',`Round ${b().round}`);commit(b().raging?'Maintain Rage: attack, force a save, or use a Bonus Action':'Next turn ready')}
function setCurrentHP(raw){const value=String(raw??'').trim();if(!/^[0-9]+$/.test(value))return note('Enter a whole-number HP value');const amount=Number(value);if(!Number.isSafeInteger(amount))return note('Enter a valid HP number');const before=b().hp;b().hp=clamp(amount,0,Math.max(0,Math.floor(n(p().maxHP))));if(b().hp>0){b().deathSuccess=0;b().deathFail=0}log('HP set',`${before} → ${b().hp} / ${p().maxHP} HP`);commit()}
function adjustCurrentHP(amount){const before=b().hp;b().hp=clamp(b().hp+amount,0,Math.max(0,Math.floor(n(p().maxHP))));if(b().hp>0){b().deathSuccess=0;b().deathFail=0}log('HP adjusted',`${before} → ${b().hp} / ${p().maxHP} HP`);commit()}
function applyHP(kind){const amount=Math.max(0,Math.floor(n(kind==='heal'?u().healAmount:u().damageAmount)));if(!amount){note('Enter an amount first');return}
 if(kind==='heal'){const prev=b().hp;b().hp=clamp(b().hp+amount,0,p().maxHP);if(b().hp>0){b().deathSuccess=0;b().deathFail=0}log('Healing',`${amount} applied · ${prev} → ${b().hp} HP`)}else{const dt=u().damageType;const resisting=(b().raging&&['slashing','piercing','bludgeoning'].includes(dt))||(b().frostHeld&&dt==='fire');const after=resisting?Math.floor(amount/2):amount;const absorb=Math.min(after,b().temp);b().temp-=absorb;b().hp=clamp(b().hp-(after-absorb),0,p().maxHP);log('Damage',`${amount} ${dt}${resisting?` → ${after} resisted`:''}${absorb?` · ${absorb} temp absorbed`:''} · ${b().hp} HP`)}commit()}
function giantUse(){const g=ancestry[p().giantAncestry]||ancestry.none;if(g.type==='none')return note('Choose your Giant Ancestry in Settings');if(b().giantUses<=0)return note('No Giant Ancestry uses left');if(g.type==='bonus'&&b().bonus)return note('Bonus action already spent');if(g.type==='reaction'&&b().reaction)return note('Reaction already spent');b().giantUses--;if(g.type==='bonus')b().bonus=true;if(g.type==='reaction')b().reaction=true;
 let extra='';if(g.die){const d=die(g.die),flat=p().giantAncestry==='stone'?ability('con'):0;extra=`Rolled ${d}${flat?` ${signed(flat)} CON`:''} = ${d+flat}`}else extra=g.type==='onhit'?'Effect applied on successful hit':g.type==='bonus'?'Teleport up to 30 ft.':'Effect applied';addResult('ability',g.name,extra.match(/= (\d+)/)?Number(extra.match(/= (\d+)/)[1]):'✓',extra);commit()}
function warriorHeal(){const amount=clamp(Math.floor(n(u().warriorCount,1)),1,b().warriorDice);if(amount<1)return note('No healing dice remaining');if(b().bonus)return note('Bonus action already spent');const ds=rolls(amount,12),total=sum(ds);b().warriorDice-=amount;b().bonus=true;b().hp=clamp(b().hp+total,0,p().maxHP);if(b().hp>0){b().deathSuccess=0;b().deathFail=0}addResult('ability','Warrior of the Gods',total,`${amount}d12 [${ds.join(', ')}] · healed to ${b().hp}/${p().maxHP}`);commit()}
function hitDieHeal(){if(b().hitDice<1)return note('No Hit Dice left');const d=die(12);const amount=Math.max(0,d+ability('con'));b().hitDice--;b().hp=clamp(b().hp+amount,0,p().maxHP);addResult('rest','Hit Die recovery',amount,`1d12 [${d}] ${signed(ability('con'))} CON · ${b().hitDice} dice left`);commit()}
function shortRest(){if(!confirm('Take a short rest? You regain one Rage. Hit Dice healing is separate.'))return;b().rages=Math.min(p().maxRages,b().rages+1);b().raging=false;b().reckless=false;b().action=false;b().bonus=false;b().reaction=false;log('Short rest','+1 expended Rage restored (maximum applies)');commit()}
function longRest(){if(!confirm('Finish a long rest? Restore HP and all limited-use abilities, and reset combat?'))return;const keepFrost=b().frostHeld;state.battle=starter().battle;b().hp=p().maxHP;b().rages=p().maxRages;b().giantUses=prof();b().warriorDice=p().maxWarriorDice;b().hitDice=p().level;b().frostHeld=keepFrost;u().lastAttack=null;log('Long rest','HP and all resources restored');commit()}
function resetAll(){if(!confirm('Reset Olof to the saved GM-sheet defaults? All edits, HP tracking and history will be discarded.'))return;state=starter();commit('Restored sheet defaults')}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportState(){download('olof-combat-backup.json',JSON.stringify(state,null,2),'application/json');note('Backup downloaded')}
function panel(title,body,more=''){return `<section class="panel"><div class="head"><h3>${title}</h3>${more}</div><div class="body">${body}</div></section>`}
function quickHP(){return `<section class="quick-hp" aria-label="Current hit point controls"><div class="quick-hp-copy"><strong>${b().hp} / ${p().maxHP} HP</strong><span>Current hit points</span></div><div class="quick-hp-tools"><div class="quick-hp-set"><label><span class="fieldlabel">Set exact HP</span><input id="hp-set-input" type="number" inputmode="numeric" min="0" max="${p().maxHP}" step="1" class="field" value="${b().hp}" aria-label="Set current hit points"></label>${button('Set HP','sethp','primary')}</div><div class="quick-hp-adjust">${button('−5','hpminus5','red')}${button('−1','hpminus1','red')}${button('+1','hpplus1','green')}${button('+5','hpplus5','green')}</div></div><div class="quick-hp-help">Manual changes are saved automatically. For incoming damage with Rage resistance or temporary HP, use “Take damage” in Health & recovery below.</div></section>`}
function stats(){return `<div class="stats">${stat('Hit points',`${b().hp}<small> / ${p().maxHP}</small>`,b().temp?`+${b().temp} temporary HP`:'Current HP','hp')}${stat('Armor class',p().ac,'Unarmored Defense')}${stat('Speed',`${n(p().baseSpeed)+(b().largeActive?10:0)}<small> ft</small>`,b().largeActive?'Large Form active':'Base movement')}${stat('Initiative',signed(ability('dex')),'DEX modifier')}${stat('Proficiency',signed(prof()),`Level ${p().level}`)}</div>`}
function resultView(){const r=u().lastResult;if(!r)return `<div class="dieresult"><div><div class="caption">Your most recent roll</div><div class="formula">Tap an attack or ability to begin.</div></div><div class="number">—</div></div>`;return `<div class="dieresult"><div style="min-width:0"><div class="caption">${esc(r.title)}</div><div class="formula">${esc(r.details)}</div></div><div class="number ${esc(r.cls)}">${esc(r.total)}</div></div>`}
function attacks(){const id=u().weapon,w=W[id],a=u().lastAttack;return panel('Weapons & attacks',`<div class="between mb8"><div class="sub">Select a weapon</div>${pill('2 attacks / Attack action')}</div><div class="weaponbar">${Object.entries(W).map(([key,v])=>`<button class="weapon ${u().weapon===key?'selected':''}" data-weapon="${key}"><strong>${v.name}</strong><span>+${atkMod(key)} · 1d${wDie(key)}${key==='frost'?'+cold':''}</span></button>`).join('')}</div><div class="row between mt14"><div><div style="font-size:18px;font-weight:750">${w.name} ${pill(signed(atkMod(id))+' to hit','gold')}</div><div class="sub" style="margin-top:6px">1d${wDie(id)} ${signed(damageMod(id))} ${b().raging?'+ 2 Rage':''}${id==='frost'?' + 1d6 cold':''} · ${w.reach}</div></div></div><div class="fieldrow mt14"><label><span class="fieldlabel">Attack roll mode</span><select class="field" data-field="ui.rollMode"><option value="normal" ${u().rollMode==='normal'?'selected':''}>Normal</option><option value="adv" ${u().rollMode==='adv'?'selected':''}>Advantage</option><option value="dis" ${u().rollMode==='dis'?'selected':''}>Disadvantage</option></select></label><label><span class="fieldlabel">Target AC (optional)</span><input type="number" inputmode="numeric" class="field" placeholder="e.g. 15" value="${esc(u().targetAC)}" data-field="ui.targetAC" min="1" max="40"></label></div><div class="attackroll">${button('⚔ Roll attack','attack','primary lg full')}${button(a?`Roll ${a.crit?'CRITICAL ':''}damage`:'Roll damage','damage','lg full',a&&a.hit!==false?'':'disabled')}</div>${a?`<div class="micro">Last attack: ${esc(W[a.id].name)} · natural ${a.natural} ${a.ds.length>1?'('+a.ds.join(', ')+')':''} · ${a.hit===null?'Ask DM whether it hit':a.hit?'Hit':'Miss'}${a.crit?' · <b style="color:var(--gold)">Critical hit</b>':''}. Damage rolls count as confirmed hits.</div>`:''}${resultView()}<div class="tiny-actions">${p().masteries.includes('greataxe')&&id==='greataxe'?button('Cleave · 2nd target','cleave','ghost sm',b().cleaveUsed||!a||a.id!=='greataxe'||a.hit===false?'disabled':''):''}${id==='handaxe'&&p().masteries.includes('dagger')?button('Nick dagger attack','nick','ghost sm',b().nickUsed||!b().lightAttacked?'disabled':''):''}${id==='handaxe'||id==='dagger'?button(`Offhand ${id==='handaxe'?'dagger':'handaxe'}`,'offhand','ghost sm',b().bonus||!b().lightAttacked?'disabled':''):''}</div><div class="micro mt8">${esc(w.notes)}${w.mastery!=='—'?` · ${esc(w.mastery)} mastery ${p().masteries.includes(id)?'selected':'not confirmed'}`:''}. ${b().raging?'Divine Fury adds 1d6 + '+Math.floor(p().level/2)+' to the first hit each turn.':'Rage is inactive.'}</div>`,pill(b().attacks+'/2 attacks','gold'))}
function toggles(){return panel('Battle stance',`<div class="togglegrid"><button class="toggle ${b().raging?'on':''}" data-act="rage"><b>${b().raging?'● Raging':'Rage'}</b><span>${b().raging?'Resistance on':`${b().rages} uses left`}</span></button><button class="toggle ${b().reckless?'on':''}" data-act="reckless"><b>Reckless</b><span>${b().reckless?'Advantage on':'Toggle on turn'}</span></button><button class="toggle ${b().largeActive?'on':''}" data-act="large"><b>Large Form</b><span>${b().largeActive?'Active · +10 ft':b().largeUsed?'Expended':'1 / long rest'}</span></button></div><p class="micro" style="margin:13px 0 0">Rage: +2 damage on Strength attacks; resistance to bludgeoning, piercing, slashing; Strength check/save advantage. Reckless: your Strength attacks gain advantage, but enemies gain advantage against you until your next turn.</p>`)}
function actions(){return panel('Turn & action economy',`<div class="between mb8"><div><div style="font:24px Georgia,serif">Round ${b().round}</div><div class="micro">Track resources used this turn</div></div>${button('Next turn →','nextturn','primary')}</div><div class="tiles">${[['action','Action'],['bonus','Bonus'],['reaction','Reaction']].map(([key,label])=>`<button class="tile ${b()[key]?'used':''}" data-toggle="${key}">${label}<strong>${b()[key]?'Used':'Ready'}</strong></button>`).join('')}<div class="tile">Attacks<strong>${b().attacks} / 2</strong></div></div><div class="between mt14"><span class="micro">Divine Fury: ${b().divineUsed?'used this turn':'ready if raging'}</span><span class="micro">Cleave: ${b().cleaveUsed?'used':'ready'}</span></div>`)}
function health(){let pct=clamp(Math.round(100*b().hp/Math.max(1,p().maxHP)),0,100);return panel('Health & recovery',`<div class="between"><div><span style="font-size:32px;font-weight:800;font-variant-numeric:tabular-nums">${b().hp}</span><span class="muted"> / ${p().maxHP} HP</span></div>${pill(b().hp===0?'UNCONSCIOUS':b().hp<=p().maxHP/4?'CRITICAL':'ACTIVE',b().hp<=p().maxHP/4?'red':'green')}</div><div class="hpbar"><i style="width:${pct}%"></i></div><div class="fieldrow"><label><span class="fieldlabel">Amount</span><input class="field" type="number" min="0" inputmode="numeric" data-field="ui.damageAmount" value="${esc(u().damageAmount)}" placeholder="Damage taken"></label><label><span class="fieldlabel">Damage type</span><select class="field" data-field="ui.damageType">${['slashing','piercing','bludgeoning','fire','cold','lightning','acid','necrotic','radiant','poison','psychic','thunder','force'].map(x=>`<option value="${x}" ${u().damageType===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label></div><div class="hpbuttons mt8">${button('− Take damage','hpdamage','red full')}${button('+ Heal HP','hpheal','green full')}${button('Temp HP','temphp','ghost full')}</div><div class="micro mt8">Damage automatically halves if your current Rage or held Frost Brand grants resistance; temporary HP absorbs damage first. Healing uses the same Amount field.</div><div class="separator"></div><div class="between"><span class="plabel">Temporary HP</span><div class="row">${button('−1','tempdown','ghost sm')}${pill(String(b().temp))}${button('+1','tempup','ghost sm')}</div></div><div class="between mt14"><span class="plabel">Frost Brand currently held (fire resistance)</span><button class="btn sm ${b().frostHeld?'green':'ghost'}" data-act="frostheld">${b().frostHeld?'Yes':'No'}</button></div>${b().hp===0?`<div class="separator"></div><div class="sectionname mb8">Death saving throws</div><div class="between"><span class="plabel">Success ${b().deathSuccess}/3 · Failure ${b().deathFail}/3</span><div class="row">${button('+ Success','deathsuccess','green sm')}${button('+ Failure','deathfail','red sm')}</div></div>`:''}`)}
function resources(){const a=ancestry[p().giantAncestry]||ancestry.none;return panel('Limited-use abilities',`<div class="resource"><div class="between"><div class="sectionname">Rage</div>${dots(b().rages,p().maxRages,'rages')}</div><div class="smallnote">${b().rages} of ${p().maxRages} remaining · recover 1 on short rest; all on long rest</div></div><div class="resource"><div class="between"><div class="sectionname">Warrior of the Gods</div>${dots(b().warriorDice,p().maxWarriorDice,'warriorDice')}</div><div class="smallnote">${b().warriorDice}d12 remaining · Bonus Action to heal yourself</div><div class="row mt8"><select class="field small" data-field="ui.warriorCount" aria-label="Healing dice to spend">${Array.from({length:p().maxWarriorDice},(_,i)=>`<option value="${i+1}" ${n(u().warriorCount,1)===i+1?'selected':''}>${i+1}d12</option>`).join('')}</select>${button('Roll & heal','warrior','green sm',b().warriorDice===0||b().bonus?'disabled':'')}</div></div><div class="resource"><div class="between"><div class="sectionname">Giant Ancestry ${pill(a.name,'gold')}</div>${dots(b().giantUses,prof(),'giantUses')}</div><div class="smallnote">${esc(a.use)}</div>${button('Use Giant boon','giant','ghost sm mt8',b().giantUses===0||a.type==='none'?'disabled':'')}</div><div class="resource"><div class="between"><div class="sectionname">Large Form</div>${pill(b().largeActive?'ACTIVE':b().largeUsed?'USED':'AVAILABLE',b().largeActive?'gold':'')}</div><div class="smallnote">Bonus Action · 10 minutes · Large size; Strength checks with advantage; +10 ft. Speed</div></div><div class="resource"><div class="between"><div class="sectionname">Hit Dice</div>${dots(b().hitDice,p().level,'hitDice')}</div><div class="smallnote">D12 ${signed(ability('con'))} CON per die during a Short Rest · ${b().hitDice} remaining</div>${button('Spend 1 Hit Die','hitdie','ghost sm mt8',b().hitDice===0?'disabled':'')}</div><div class="tiny-actions mt14">${button('Short rest','shortrest','ghost sm')}${button('Long rest','longrest','ghost sm')}</div>`)}
function conditions(){const names=['Prone','Grappled','Restrained','Frightened','Poisoned','Stunned','Incapacitated','Blinded','Exhaustion'];return panel('Conditions',`<div class="condgrid">${names.map(x=>`<button class="cond ${b().conditions.includes(x)?'active':''}" data-condition="${x}">${b().conditions.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><div class="micro mt8">Conditions are manual reminders; their exact mechanical effects depend on the rules and situation.</div>`)}
function diary(){return panel('Roll history',`<div class="history">${u().history.length?u().history.slice(0,12).map(x=>`<div class="logitem"><time>${esc(x.time)}</time><div><strong>${esc(x.title)}</strong><br>${esc(x.detail)}</div></div>`).join(''):'<div class="micro">Your rolls and combat actions appear here.</div>'}</div><div class="row mt14">${[4,6,8,10,12,20].map(x=>button('d'+x,'dice'+x,'ghost sm')).join('')}</div>`)}
function combat(){return `<div class="headline"><div><div class="eyebrow">THE WARRIOR'S TABLE</div><h2>Combat dashboard</h2><p class="desc">Everything important, without flipping through a sheet.</p></div>${pill(b().raging?'RAGE ACTIVE':'LEVEL '+p().level,b().raging?'red':'gold')}</div>${stats()}${quickHP()}<div class="layout"><div class="colstack">${toggles()}${attacks()}${actions()}${health()}</div><div class="colstack">${resources()}${conditions()}${diary()}</div></div>`}

{title:'Frost Brand',meta:['Magic weapon'],desc:'The stored weapon uses 1d8 slashing plus 1d6 cold on a hit. While holding the sword, you have resistance to fire damage. In freezing temperatures it sheds light, and once per hour on drawing it can extinguish nonmagical flames within 30 feet.'}

function feats(){return `<div class="headline"><div><div class="eyebrow">QUICK RULES</div><h2>Features & abilities</h2><p class="desc">Concise text adapted from Olof’s saved character sheet.</p></div></div><div class="sectiongrid">${featureList.map(f=>`<article class="feat"><h4>${f.title}</h4><div>${f.meta.map(x=>pill(x,'')).join(' ')}</div><p>${f.desc}</p></article>`).join('')}</div><div class="footer">When in doubt, your DM and official 2024 rules take precedence.</div>`}
const skillList=[['Athletics','str',true],['Acrobatics','dex',true],['Perception','wis',true],['Intimidation','cha',false],['Stealth','dex',false],['Survival','wis',false],['Animal Handling','wis',false],['Arcana','int',false],['Deception','cha',false],['History','int',false],['Insight','wis',false],['Investigation','int',false],['Medicine','wis',false],['Nature','int',false],['Performance','cha',false],['Persuasion','cha',false],['Religion','int',false],['Sleight of Hand','dex',false]];
function sheet(){const vals=['str','dex','con','int','wis','cha'];return `<div class="headline"><div><div class="eyebrow">CHARACTER RECORD</div><h2>Olof's sheet</h2><p class="desc">The recovered GM values are editable in Settings.</p></div>${pill('GOLIATH · ZEALOT','gold')}</div>${panel('Ability scores',`<div class="skillgrid">${vals.map(k=>`<div class="ability"><div class="lbl">${k.toUpperCase()}</div><div class="mod">${signed(ability(k))}</div><div class="score">Score ${p()[k]}</div></div>`).join('')}</div><div class="micro mt14">Saving throw proficiencies: Strength ${signed(ability('str')+prof())}; Constitution ${signed(ability('con')+prof())}. Danger Sense grants advantage on Dexterity saves unless incapacitated.</div>`)}<div class="sectiongrid mt14">${panel('Skills',`<table class="table"><thead><tr><th>Skill</th><th>Bonus</th><th>Training</th></tr></thead><tbody>${skillList.map(([name,stat,trained])=>`<tr><td><button class="textlink" data-skill="${name}">${name} ↗</button></td><td>${signed(ability(skillStat(name,stat))+(trained?prof():0))}</td><td>${trained?'Proficient':'—'}</td></tr>`).join('')}</tbody></table><div class="between mt14"><span class="plabel">Use Primal Knowledge STR when raging</span><button class="btn sm ${u().primalKnowledge?'green':'ghost'}" data-act="primal">${u().primalKnowledge?'Yes':'No'}</button></div><p class="micro mt8">Tap a skill to roll. Only proficiencies explicitly named on the GM sheet are marked. Additional Barbarian skill selections may need confirmation.</p>`)}${panel('Weapons & equipment',`<table class="table"><thead><tr><th>Weapon</th><th>Attack</th><th>Damage</th></tr></thead><tbody>${Object.entries(W).map(([id,w])=>`<tr><td>${w.name}</td><td>${signed(atkMod(id))}</td><td>1d${wDie(id)} ${signed(damageMod(id))}${id==='frost'?'<br>+1d6 cold':''}</td></tr>`).join('')}</tbody></table><div class="separator"></div><p class="sub">4 Handaxes · 1 Dagger · 1 Greataxe · Frost Brand</p><p class="sub">Navigator’s Tools · Traveler’s Clothes · 26 gold pieces</p><div class="separator"></div><p class="sub">Medium / Light armor, shields, Simple & Martial weapons, Navigator’s Tools</p>`)}${panel('Character details',`<table class="table"><tbody>${[['Name',p().name],['Class',p().className],['Subclass',p().subclass],['Species',p().race],['Background',p().background],['Level',p().level],['Hit Die','d12'],['Passive Perception',10+ability('wis')+prof()],['Walking Speed',p().baseSpeed+' ft.'],['Proficiency Bonus',signed(prof())]].map(([k,v])=>`<tr><td class="muted">${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`)}${panel('Quick dice',`<div class="row">${button('Roll initiative','initiative','primary')}${['str','dex','con','int','wis','cha'].map(k=>button(k.toUpperCase()+' save','save'+k,'ghost sm')).join('')}</div><div class="separator"></div>${resultView()}`)}</div><div class="notebox mt14">Source discrepancy: the player XML records base ability scores 16/14/15/8/10/12 and damage taken 19 (likely 29/48 HP). The separate GM export lists STR 20, DEX 16, CON 18, INT 7, WIS 10, CHA 13 and HP 17/48. This app starts with the GM export so its listed AC 17 and +8 attacks agree with the calculations. Verify these numbers with your DM.</div>`}
function inputNumber(label,path,val,min,max){return `<label><span class="fieldlabel">${label}</span><input class="field" type="number" inputmode="numeric" min="${min}" max="${max}" data-field="${path}" value="${esc(val)}"></label>`}
function settings(){return `<div class="headline"><div><div class="eyebrow">PERSONALIZE</div><h2>Character settings</h2><p class="desc">Edits save automatically on this device.</p></div></div><div class="sectiongrid">${panel('Character statistics',`<div class="fieldrow">${inputNumber('Level','profile.level',p().level,1,20)}${inputNumber('Proficiency','profile.proficiency',p().proficiency,2,6)}${inputNumber('Maximum HP','profile.maxHP',p().maxHP,1,400)}${inputNumber('Armor class','profile.ac',p().ac,1,40)}${inputNumber('Base Speed (ft.)','profile.baseSpeed',p().baseSpeed,0,200)}${inputNumber('Max Rages','profile.maxRages',p().maxRages,0,10)}${inputNumber('Warrior of the Gods dice','profile.maxWarriorDice',p().maxWarriorDice,0,10)}${inputNumber('Mastery weapon slots','profile.masteryLimit',p().masteryLimit,0,8)}</div><div class="separator"></div><div class="fieldrow">${['str','dex','con','int','wis','cha'].map(k=>inputNumber(k.toUpperCase(),`profile.${k}`,p()[k],1,30)).join('')}</div>`)}${panel('Goliath Giant Ancestry',`<label><span class="fieldlabel">Your chosen giant boon</span><select class="field" data-field="profile.giantAncestry">${Object.entries(ancestry).map(([id,a])=>`<option value="${id}" ${p().giantAncestry===id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><p class="micro mt14">Your source sheet includes all ancestry possibilities but does not identify the one selected. Set this once to unlock the right action, reaction, or bonus damage button.</p><div class="separator"></div><div class="sectionname mb8">Weapon mastery selections (${p().masteries.length} / ${p().masteryLimit})</div>${Object.entries(W).filter(([id])=>id!=='frost').map(([id,w])=>`<label class="between" style="padding:8px 0"><span class="plabel">${w.name} · ${w.mastery}</span><input type="checkbox" data-mastery="${id}" ${p().masteries.includes(id)?'checked':''}></label>`).join('')}<p class="micro mt8">Choices were not specified in the XML. Select only the weapons Olof actually mastered. If your mastered weapon uses Vex or Nick, the app shows reminders rather than automating an extra attack without its requirements.</p>`)}${panel('Weapon adjustments',`<p class="micro">All four attack bonuses start at +8 according to the GM export. Add adjustments here only if your DM grants extra modifiers or your gear changes.</p><table class="table"><thead><tr><th>Weapon</th><th>Die</th><th>To hit +</th><th>Damage +</th></tr></thead><tbody>${Object.entries(W).map(([id,w])=>`<tr><td>${w.name}</td><td><input type="number" inputmode="numeric" class="field" style="width:55px;padding:7px 5px" data-field="profile.weaponBonuses.${id}.die" value="${esc(wDie(id))}" min="2" max="20"></td><td><input type="number" inputmode="numeric" class="field" style="width:55px;padding:7px 5px" data-field="profile.weaponBonuses.${id}.hit" value="${esc(n(p().weaponBonuses[id]?.hit))}" min="-20" max="20"></td><td><input type="number" inputmode="numeric" class="field" style="width:55px;padding:7px 5px" data-field="profile.weaponBonuses.${id}.dmg" value="${esc(n(p().weaponBonuses[id]?.dmg))}" min="-20" max="20"></td></tr>`).join('')}</tbody></table>`)}${panel('Backups & recovery',`<p class="sub">This app stores combat state locally in your browser, not on a server. Export a backup to protect against browser data loss or when switching devices.</p><div class="row mt14">${button('Export backup','export','primary')}${button('Import backup','import','ghost')}${button('Reset to original','reset','red')}</div><input type="file" id="backupfile" accept="application/json,.json" style="display:none"><div class="separator"></div><p class="micro">To use the app reliably on an iPhone, host it on a secure static website such as GitHub Pages, then use Safari → Share → Add to Home Screen. Downloading an HTML file for local preview may not preserve storage reliably in iOS Files.</p>`)} </div>`}
function nav(page){const names={combat:['⚔','Combat'],feats:['◇','Features'],sheet:['▣','Sheet'],settings:['⚙','Settings']};return Object.entries(names).map(([key,[ico,title]])=>`<button class="${page===key?'active':''}" data-page="${key}" ${page===key?'aria-current="page"':''}><span class="mobileonly">${ico}</span>${title}</button>`).join('')}
function render(){const page=u().page;document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><div class="brandmark" aria-hidden="true">ᛟ</div><div><h1>${esc(p().name)}</h1><span>COMBAT COMPANION</span></div></div><nav class="topnav" aria-label="Main navigation">${nav(page)}</nav><span class="tag desktoponly">D&D 2024 · Barbarian ${p().level}</span><span class="tag mobileonly">LVL ${p().level}</span></header><main>${page==='combat'?combat():page==='feats'?feats():page==='sheet'?sheet():settings()}</main><footer class="footer">Olof · Goliath Barbarian · Path of the Zealot<br>Local-only rolls and tracking · Your DM has final authority${saveWarning?'<br><strong>Storage unavailable: export backups frequently.</strong>':''}</footer>`;document.getElementById('bottomnav').innerHTML=nav(page)}
function setField(path,val){const parts=path.split('.');let obj=state;for(let i=0;i<parts.length-1;i++){if(!(parts[i] in obj))return;obj=obj[parts[i]]}const key=parts.at(-1);const old=obj[key];obj[key]=typeof old==='number'?n(val,old):val;if(path==='profile.maxHP'){b().hp=clamp(b().hp,0,p().maxHP)}if(path==='profile.maxRages'){b().rages=Math.min(b().rages,p().maxRages)}if(path==='profile.maxWarriorDice'){b().warriorDice=Math.min(b().warriorDice,p().maxWarriorDice)}if(path==='profile.level'){b().hitDice=Math.min(b().hitDice,p().level)}if(path==='profile.proficiency'){b().giantUses=Math.min(b().giantUses,prof())}if(path.startsWith('ui.')){save();return}if(path==='profile.masteryLimit'&&p().masteries.length>p().masteryLimit)p().masteries=p().masteries.slice(0,p().masteryLimit);save();render()}
function doAction(act){if(act==='sethp')return setCurrentHP(document.getElementById('hp-set-input')?.value);if(act==='hpminus5')return adjustCurrentHP(-5);if(act==='hpminus1')return adjustCurrentHP(-1);if(act==='hpplus1')return adjustCurrentHP(1);if(act==='hpplus5')return adjustCurrentHP(5);if(act==='attack')return rollAttack(u().weapon);if(act==='damage')return rollDamage();if(act==='cleave')return rollAttack('greataxe','cleave');if(act==='offhand')return rollAttack(u().weapon==='dagger'?'handaxe':'dagger','offhand');if(act==='nick')return rollAttack('dagger','nick');if(act==='rage')return toggleRage();if(act==='reckless')return toggleReckless();if(act==='large')return toggleLarge();if(act==='nextturn')return newTurn();if(act==='hpdamage')return applyHP('damage');if(act==='hpheal'){u().healAmount=u().damageAmount;return applyHP('heal')}if(act==='temphp'){const amount=Math.floor(n(u().damageAmount));if(!amount)return note('Enter an Amount first');b().temp=Math.max(b().temp,amount);log('Temporary HP',`Set to ${b().temp}`);return commit()}if(act==='tempup'){b().temp++;return commit()}if(act==='tempdown'){b().temp=Math.max(0,b().temp-1);return commit()}if(act==='frostheld'){b().frostHeld=!b().frostHeld;return commit()}if(act==='deathsuccess')return rollDeath('deathSuccess');if(act==='deathfail')return rollDeath('deathFail');if(act==='giant')return giantUse();if(act==='warrior')return warriorHeal();if(act==='hitdie')return hitDieHeal();if(act==='shortrest')return shortRest();if(act==='longrest')return longRest();if(act==='primal'){u().primalKnowledge=!u().primalKnowledge;return commit()}if(act==='initiative')return rollInitiative();if(act.startsWith('save'))return rollSave(act.slice(4));if(act.startsWith('dice'))return rollCustom(n(act.slice(4)));if(act==='export')return exportState();if(act==='import')return document.getElementById('backupfile')?.click();if(act==='reset')return resetAll()}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target?.id==='hp-set-input'){ev.preventDefault();setCurrentHP(ev.target.value)}});
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return; if(el.dataset.page){u().page=el.dataset.page;save();render();window.scrollTo({top:0,behavior:'smooth'});return}if(el.dataset.weapon){u().weapon=el.dataset.weapon;save();render();return}if(el.dataset.act)return doAction(el.dataset.act);if(el.dataset.toggle){const key=el.dataset.toggle;b()[key]=!b()[key];return commit()}if(el.dataset.condition){const c=el.dataset.condition;b().conditions=b().conditions.includes(c)?b().conditions.filter(x=>x!==c):[...b().conditions,c];return commit()}if(el.dataset.skill)return rollSkill(el.dataset.skill);if(el.dataset.setcount){const k=el.dataset.setcount;b()[k]=b()[k]===n(el.dataset.val)?n(el.dataset.val)-1:n(el.dataset.val);return commit()}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset?.field){setField(el.dataset.field,el.value)}if(el.dataset?.mastery){const id=el.dataset.mastery;const selected=p().masteries;if(el.checked){if(selected.length>=p().masteryLimit)return note('Maximum mastered weapons reached');if(!selected.includes(id))selected.push(id)}else p().masteries=selected.filter(x=>x!==id);commit()}if(el.id==='backupfile'){const f=el.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(obj.version!==3||!obj.profile||!obj.battle||!obj.ui)throw Error('Invalid backup');if(!confirm('Replace current data with this backup?'))return;state=obj;commit('Backup imported successfully')}catch(e){note('Invalid or incompatible backup')}};rd.readAsText(f)}});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
